{% if breadcrumbs %}
<nav class="site-breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for item in breadcrumbs %}
    <li>{% if not loop.last %}<a href="{{ item.url }}">{{ item.name }}</a>{% else %}<span aria-current="page">{{ item.name }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
{% endif %}
