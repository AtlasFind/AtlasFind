{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Accountability</span><h1>Audit log</h1></div></div><section class="admin-panel"><table class="admin-table"><tr><th>Time</th><th>Admin</th><th>Action</th><th>Entity</th><th>Summary</th></tr>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.username or 'System' }}</td><td>{{ log.action }}</td><td>{{ log.entity_type or '' }} {{ log.entity_id or '' }}</td><td>{{ log.summary }}</td></tr>{% endfor %}</table></section>{% endblock %}
