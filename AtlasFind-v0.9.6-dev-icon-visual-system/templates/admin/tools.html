{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Catalog</span><h1>Tools</h1></div><a class="primary-button" href="{{ url_for('admin.tool_form') }}">Add tool</a></div><section class="admin-panel"><table class="admin-table"><tr><th>Name</th><th>Slug</th><th>Status</th><th>Updated</th><th></th></tr>{% for tool in tools %}<tr><td>{{ tool.name }}</td><td>{{ tool.slug }}</td><td><span class="status-pill">{{ tool.status }}</span></td><td>{{ tool.updated_at }}</td><td><a href="{{ url_for('admin.tool_form', tool_id=tool.id) }}">Edit</a></td></tr>{% endfor %}</table></section>{% endblock %}
