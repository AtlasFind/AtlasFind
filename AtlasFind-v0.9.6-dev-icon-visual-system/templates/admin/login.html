<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · AtlasFind</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-login-body"><form class="admin-login-card" method="post"><h1>AtlasFind Admin</h1><p>Sign in to manage tools and editorial content.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="admin-alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">Sign in</button></form></body></html>
