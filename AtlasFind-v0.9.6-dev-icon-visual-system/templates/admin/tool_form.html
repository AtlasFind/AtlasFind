{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Tool editor</span><h1>{{ record.name if record else 'New tool' }}</h1></div>{% if record %}<a class="secondary-button" href="{{ url_for('admin.tool_preview', tool_id=record.id) }}">Preview</a>{% endif %}</div>{% if missing %}<div class="admin-alert warning">Missing fields: {{ missing|join(', ') }}</div>{% endif %}<form class="admin-panel admin-editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Status<select name="status"><option value="draft" {% if status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if status=='published' %}selected{% endif %}>Published</option><option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option></select></label><label>Tool JSON<textarea name="payload_json" rows="34" spellcheck="false">{{ payload_json }}</textarea></label><div class="admin-actions"><button class="primary-button" type="submit">Save tool</button>{% if record %}</div></form><form method="post" action="{{ url_for('admin.tool_archive', tool_id=record.id) }}" onsubmit="return confirm('Archive this tool?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger-button">Archive</button></form>{% else %}</div></form>{% endif %}{% endblock %}
