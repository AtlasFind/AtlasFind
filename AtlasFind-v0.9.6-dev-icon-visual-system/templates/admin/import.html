{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Bulk workflow</span><h1>Import tools</h1></div></div><form class="admin-panel admin-editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>JSON payload<textarea name="payload_json" rows="24" placeholder='[{"name":"Example", ...}]'></textarea></label><button class="primary-button">Validate import</button></form>{% if preview %}<section class="admin-panel"><h2>Preview: {{ preview|length }} tools</h2><ul>{% for tool in preview[:20] %}<li>{{ tool.name }} · {{ tool.slug }}</li>{% endfor %}</ul><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="confirm" value="1"><textarea hidden name="payload_json">{{ preview|tojson }}</textarea><button class="primary-button">Import as drafts</button></form></section>{% endif %}{% endblock %}
