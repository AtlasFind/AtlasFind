{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Article editor</span><h1>{{ record.title if record else 'New article' }}</h1></div></div>{% if missing %}<div class="admin-alert warning">Missing fields: {{ missing|join(', ') }}</div>{% endif %}<form class="admin-panel admin-editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Status<select name="status"><option value="draft" {% if status=='draft' %}selected{% endif %}>Draft</option><option value="published" {% if status=='published' %}selected{% endif %}>Published</option><option value="archived" {% if status=='archived' %}selected{% endif %}>Archived</option></select></label><label>Article JSON<textarea name="payload_json" rows="34" spellcheck="false">{{ payload_json }}</textarea></label><button class="primary-button" type="submit">Save article</button></form>{% endblock %}
