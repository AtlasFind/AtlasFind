{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">Editorial</span><h1>Articles</h1></div><a class="primary-button" href="{{ url_for('admin.article_form') }}">Add article</a></div><section class="admin-panel"><table class="admin-table"><tr><th>Title</th><th>Slug</th><th>Status</th><th>Updated</th><th></th></tr>{% for article in articles %}<tr><td>{{ article.title }}</td><td>{{ article.slug }}</td><td>{{ article.status }}</td><td>{{ article.updated_at }}</td><td><a href="{{ url_for('admin.article_form', article_id=article.id) }}">Edit</a></td></tr>{% endfor %}</table></section>{% endblock %}
