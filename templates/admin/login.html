<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ t("admin.login_title") }}</title><link rel="icon" type="image/png" href="{{ url_for('static', filename='images/atlasfind-duck-64.png') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='images/atlasfind-duck-192.png') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-login-body"><form class="admin-login-card" method="post"><img class="admin-login-avatar" src="{{ url_for('static', filename='images/atlasfind-duck-192.png') }}" alt="AtlasFind detective duck" width="112" height="112"><h1>{{ t("admin.brand") }}</h1><p>{{ t("admin.login_help") }}</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="admin-alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t("admin.username") }}<input name="username" required autocomplete="username"></label><label>{{ t("admin.password") }}<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-button" type="submit">{{ t("admin.sign_in") }}</button></form></body></html>
