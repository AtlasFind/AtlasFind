{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">{{ t("admin.article_editor") }}</span><h1>{{ record.title if record else 'New article' }}</h1></div></div>{% if missing %}<div class="admin-alert warning">Missing fields: {{ missing|join(', ') }}</div>{% endif %}<form class="admin-panel admin-editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t("admin.status") }}<select name="status"><option value="draft" {% if status=='draft' %}selected{% endif %}>{{ t("admin.draft") }}</option><option value="published" {% if status=='published' %}selected{% endif %}>{{ t("admin.published") }}</option><option value="archived" {% if status=='archived' %}selected{% endif %}>{{ t("admin.archived") }}</option></select></label><label>{{ t("admin.article_json") }}<textarea name="payload_json" rows="34" spellcheck="false">{{ payload_json }}</textarea></label><button class="primary-button" type="submit">{{ t("admin.save_article") }}</button></form>{% endblock %}
