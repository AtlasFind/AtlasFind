<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Admin · AtlasFind{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="logo" href="{{ url_for('admin.dashboard') }}"><span class="logo-icon">A</span><span class="logo-text">Atlas<span>Find</span></span></a><nav><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.tools') }}">Tools</a><a href="{{ url_for('admin.articles') }}">Articles</a><a href="{{ url_for('admin.taxonomy') }}">Taxonomy</a><a href="{{ url_for('admin.import_tools') }}">Import</a><a href="{{ url_for('admin.audit') }}">Audit log</a><a href="{{ url_for('home') }}">View site</a></nav><form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary-button" type="submit">Sign out</button></form></aside><main class="admin-main">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="admin-alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></div></body></html>
