{% extends 'admin/base.html' %}{% block content %}<div class="admin-page-heading"><div><span class="eyebrow">{{ t("admin.tool_editor") }}</span><h1>{{ record.name if record else 'New tool' }}</h1></div>{% if record %}<a class="secondary-button" href="{{ url_for('admin.tool_preview', tool_id=record.id) }}">{{ t("admin.preview") }}</a>{% endif %}</div>{% if missing %}<div class="admin-alert warning">Missing fields: {{ missing|join(', ') }}</div>{% endif %}<form class="admin-panel admin-editor" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ t("admin.status") }}<select name="status"><option value="draft" {% if status=='draft' %}selected{% endif %}>{{ t("admin.draft") }}</option><option value="published" {% if status=='published' %}selected{% endif %}>{{ t("admin.published") }}</option><option value="archived" {% if status=='archived' %}selected{% endif %}>{{ t("admin.archived") }}</option></select></label><label>{{ t("admin.tool_json") }}<textarea name="payload_json" rows="34" spellcheck="false">{{ payload_json }}</textarea></label><div class="admin-actions"><button class="primary-button" type="submit">{{ t("admin.save_tool") }}</button>{% if record %}</div></form><form method="post" action="{{ url_for('admin.tool_archive', tool_id=record.id) }}" onsubmit="return confirm('Archive this tool?')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger-button">{{ t("admin.archive") }}</button></form>{% else %}</div></form>{% endif %}{% endblock %}
