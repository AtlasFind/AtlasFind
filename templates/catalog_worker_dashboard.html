<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtlasFind Katalog İşçisi</title><style>
:root{color-scheme:dark;--bg:#080914;--card:#131526;--line:#2b2e48;--muted:#9ca4bf;--purple:#8b5cf6;--green:#22d391;--red:#ff647c;--amber:#ffc45c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,#28164c 0,transparent 32%),var(--bg);font:14px Inter,Segoe UI,sans-serif;color:#f8f8fc}.wrap{max-width:1450px;margin:auto;padding:26px}.top,.controls,.title,.actions{display:flex;gap:12px;align-items:center}.top{justify-content:space-between}.brand h1{margin:0 0 7px;font-size:30px}.muted,.brand p{color:var(--muted)}button{border:1px solid #6042a7;background:#211a37;color:#fff;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#7143e7}.danger{border-color:#733143;color:#ff9bab}.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:22px 0}.stat,.tool,.modal-card{background:rgba(19,21,38,.96);border:1px solid var(--line);border-radius:16px}.stat{padding:15px}.stat b{font-size:23px;display:block}.stat span{color:var(--muted);font-size:12px}.controls{margin-bottom:17px}.controls input,.controls select,textarea{background:#111326;border:1px solid var(--line);color:white;padding:11px;border-radius:10px}.controls input{flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tool{padding:17px;cursor:pointer}.tool:hover{border-color:#7050bb}.title{justify-content:space-between}.title h2{font-size:18px;margin:0}.desc{color:#c9ccda;line-height:1.5;min-height:62px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag,.badge{border:1px solid #3b3f61;border-radius:99px;padding:5px 8px;font-size:11px}.badge.pending{color:var(--amber)}.badge.rejected{color:var(--red)}.badge.approved_for_export{color:var(--green)}.missing{color:#ffadba;font-size:12px;margin:10px 0}.modal{position:fixed;inset:0;background:#05060bcc;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.modal-card{width:min(1000px,100%);max-height:92vh;overflow:auto;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:start}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin:13px 0}.field label{display:block;color:#b7bed6;font-weight:700;margin-bottom:6px}.field textarea,.field input{width:100%;background:#0e1020;border:1px solid var(--line);color:#fff;border-radius:9px;padding:10px}.claims{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.claim{border:1px solid var(--line);border-radius:9px;padding:9px}.claim b{display:block}.source{display:block;color:#c9b7ff;margin:7px 0;word-break:break-all}.actions{position:sticky;bottom:0;background:#131526;padding:14px 0 0;flex-wrap:wrap}@media(max-width:1000px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>🦆 AtlasFind Katalog İşçisi</h1><p><span id="workerState">Hazır</span> · İnceleme sistemi; otomatik yayın kapalı</p></div><button class="danger" onclick="stopWorker()">İşçiyi güvenle durdur</button></div><div class="stats" id="stats"></div><div class="controls"><input id="search" placeholder="Araç, açıklama, özellik veya kategori ara…" oninput="render()"><select id="category" onchange="render()"><option value="">Tüm kategoriler</option></select><select id="decision" onchange="render()"><option value="">Tüm durumlar</option><option value="pending">Bekliyor</option><option value="changes_requested">Değişiklik gerekli</option><option value="approved_for_export">Dışa aktarmaya hazır</option><option value="rejected">Reddedildi</option></select></div><div class="grid" id="grid"></div></div><div class="modal" id="modal"><div class="modal-card" id="detail"></div></div><script>
let data={records:[],stats:{},running:false},active=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){const r=await fetch('/api/records',{cache:'no-store'});data=await r.json();document.getElementById('workerState').textContent=data.running?'Çalışıyor':'Durduruldu / geliştirme modu';const counts={total:data.records.length,pending:0,approved_for_export:0,changes_requested:0,rejected:0,missing_logo:0,incomplete:0};data.records.forEach(x=>{counts[x.editorial_review?.decision||'pending']++;if(x.research_metadata?.claim_review?.avatar?.status==='missing')counts.missing_logo++;if((x.research_metadata?.missing_claims||[]).length)counts.incomplete++});const labels={total:'Toplam kayıt',pending:'İnceleme bekliyor',approved_for_export:'Dışa aktarmaya hazır',changes_requested:'Değişiklik gerekli',rejected:'Reddedildi',missing_logo:'Logo eksik',incomplete:'Eksik bilgili'};document.getElementById('stats').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${labels[k]}</span></div>`).join('');categories();render()}function categories(){const el=document.getElementById('category'),old=el.value,c=[...new Set(data.records.map(x=>x.category))].sort();el.innerHTML='<option value="">Tüm kategoriler</option>'+c.map(x=>`<option>${esc(x)}</option>`).join('');el.value=old}function render(){const q=document.getElementById('search').value.toLowerCase(),cat=document.getElementById('category').value,dec=document.getElementById('decision').value;const list=data.records.filter(x=>(!cat||x.category===cat)&&(!dec||(x.editorial_review?.decision||'pending')===dec)&&JSON.stringify(x).toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(x=>{const d=x.editorial_review?.decision||'pending',missing=x.research_metadata?.missing_claims||[];return`<article class="tool" onclick="openDetail('${esc(x.slug)}')"><div class="title"><h2>${esc(x.name)}</h2><span class="badge ${d}">${esc(d)}</span></div><p class="muted">${esc(x.category)} · ${esc(x.subcategory)}</p><p class="desc">${esc(x.description)}</p><div class="tags">${(x.features||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<span class="tag">Özellik bekleniyor</span>'}</div><div class="missing">${missing.length?'Eksik: '+esc(missing.join(', ')):'Temel alanlar toplandı'}</div></article>`}).join('')||'<p>Eşleşen kayıt yok.</p>'}function openDetail(slug){active=data.records.find(x=>x.slug===slug);const x=active,m=x.research_metadata||{},review=x.editorial_review||{},claims=m.claim_review||{};document.getElementById('detail').innerHTML=`<div class="modal-head"><div><h2>${esc(x.name)}</h2><p class="muted">#${x.id} · ${esc(x.slug)} · Yayın: ${esc(x.publication_status)}</p></div><button onclick="closeDetail()">Kapat</button></div><div class="columns"><div><div class="field"><label>İsim</label><input id="e-name" value="${esc(x.name)}"></div><div class="field"><label>Kullanım amacı</label><textarea id="e-purpose" rows="3">${esc(x.purpose||'')}</textarea></div><div class="field"><label>Ayrıntılı açıklama</label><textarea id="e-description" rows="5">${esc(x.description)}</textarea></div><div class="field"><label>Özellikler (her satıra bir tane)</label><textarea id="e-features" rows="6">${esc((x.features||[]).join('\n'))}</textarea></div><div class="field"><label>Kategori</label><input id="e-category" value="${esc(x.category)}"></div><div class="field"><label>Alt kategori</label><input id="e-subcategory" value="${esc(x.subcategory)}"></div></div><div><h3>Bilgi doğrulama durumu</h3><div class="claims">${Object.entries(claims).map(([k,v])=>`<div class="claim"><b>${esc(k)}</b><span>${esc(v.status)}</span></div>`).join('')}</div><h3>Kaynak kanıtları</h3>${(x.source_references||[]).map(s=>`<a class="source" target="_blank" href="${esc(s.url)}">${esc(s.label)} ↗</a>`).join('')||'<p class="muted">Kaynak yok.</p>'}<h3>Logo</h3><p>${esc(m.logo_review?.status||'not_started')} · ${(m.logo_review?.candidates||[]).length} aday</p><div class="field"><label>İnceleme notu</label><textarea id="review-note" rows="4">${esc(review.note||'')}</textarea></div></div></div><div class="actions"><button onclick="save('pending')">Kaydet</button><button onclick="save('changes_requested')">Değişiklik iste</button><button class="primary" onclick="save('approved_for_export')">Dışa aktarmaya hazır</button><button class="danger" onclick="save('rejected')">Reddet</button></div>`;document.getElementById('modal').classList.add('open')}function closeDetail(){document.getElementById('modal').classList.remove('open')}async function save(decision){const val=id=>document.getElementById(id).value.trim(),payload={decision,note:val('review-note'),edits:{name:val('e-name'),purpose:val('e-purpose'),description:val('e-description'),features:val('e-features').split('\n').map(x=>x.trim()).filter(Boolean),category:val('e-category'),subcategory:val('e-subcategory')}};const r=await fetch('/api/review/'+encodeURIComponent(active.slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){alert((await r.json()).error);return}closeDetail();await refresh()}async function stopWorker(){await fetch('/api/stop',{method:'POST'});await refresh()}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDetail()});refresh();setInterval(refresh,5000);
</script></body></html>
