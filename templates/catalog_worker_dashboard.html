<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtlasFind Katalog İşçisi</title><style>
:root{color-scheme:dark;--bg:#080914;--card:#131526;--line:#2c3050;--muted:#a2aac6;--purple:#7c4df0;--green:#27d495;--red:#ff6680;--amber:#ffc85c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#291450,transparent 34%),var(--bg);font:14px Segoe UI,sans-serif;color:#fafaff}.wrap{max-width:1450px;margin:auto;padding:28px}.top,.buttons,.controls,.head{display:flex;align-items:center;gap:12px}.top{justify-content:space-between}.brand h1{font-size:30px;margin:0 0 6px}.brand p,.muted{color:var(--muted)}button{padding:12px 17px;border-radius:11px;border:1px solid #5e467f;background:#211936;color:#fff;font-weight:700;cursor:pointer}.start{background:#236b51;border-color:#339c76}.stop{color:#ff9caf;border-color:#713246}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin:23px 0}.stat,.tool{background:rgba(19,21,38,.96);border:1px solid var(--line);border-radius:16px}.stat{padding:16px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.controls{margin-bottom:18px}.controls input,.controls select{padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:#fff}.controls input{flex:1}.notice{padding:13px 16px;border:1px solid #574583;background:#201735;border-radius:12px;margin-bottom:17px;color:#d9cff5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tool{padding:17px}.head{justify-content:space-between}.head h2{margin:0;font-size:18px}.badge{border:1px solid #4b506e;border-radius:99px;padding:5px 8px;font-size:11px}.complete{color:var(--green)}.research{color:var(--amber)}.desc{color:#ccd0df;line-height:1.5;min-height:62px}.progress{height:7px;background:#252940;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6d42de,#27d495)}.missing{color:#ff9caf;font-size:12px;margin-top:9px}.empty{text-align:center;padding:50px;color:var(--muted);grid-column:1/-1}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.controls{flex-wrap:wrap}}
</style></head><body><main class="wrap"><section class="top"><div class="brand"><h1>🦆 AtlasFind Katalog İşçisi</h1><p id="state">Durum kontrol ediliyor…</p></div><div class="buttons"><button class="start" id="start" onclick="startWorker()">▶ İşçiyi başlat</button><button class="stop" id="stop" onclick="stopWorker()">■ Durdur ve dışa aktar</button></div></section><section class="stats" id="stats"></section><div class="notice">Ana listede varsayılan olarak yalnızca amacı, özellikleri, platformu, fiyat kanıtı, kaynakları ve logo adayı bulunan tamamlanmış araçlar gösterilir. Ham adaylar “Araştırma kuyruğu” filtresindedir.</div><section class="controls"><input id="search" placeholder="Araç, açıklama veya kategori ara…" oninput="render()"><select id="view" onchange="render()"><option value="complete">Tam verili araçlar</option><option value="research">Araştırma kuyruğu</option><option value="all">Tüm kayıtlar</option></select><select id="category" onchange="render()"><option value="">Tüm kategoriler</option></select></section><section class="grid" id="grid"></section></main><script>
let data={records:[],running:false};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){const r=await fetch('/api/records',{cache:'no-store'});data=await r.json();document.getElementById('state').textContent=data.running?'🟢 Çalışıyor · otomatik yayın kapalı':'🔴 Durduruldu · başlatmaya hazır';document.getElementById('start').disabled=data.running;document.getElementById('stop').disabled=!data.running;const complete=data.records.filter(x=>x.collection_completeness?.complete).length,pending=data.records.length-complete,logos=data.records.filter(x=>(x.research_metadata?.logo_review?.candidates||[]).length).length,errors=data.records.filter(x=>x.research_metadata?.logo_review?.status==='retry_required').length;const s=[['Toplam aday',data.records.length],['Tam verili',complete],['Araştırılıyor',pending],['Logo bulunan',logos],['Bağlantı hatası',errors],['Yayına otomatik giden',0]];document.getElementById('stats').innerHTML=s.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');categories();render()}
function categories(){const e=document.getElementById('category'),old=e.value,values=[...new Set(data.records.map(x=>x.category))].sort();e.innerHTML='<option value="">Tüm kategoriler</option>'+values.map(x=>`<option>${esc(x)}</option>`).join('');e.value=old}
function render(){const q=document.getElementById('search').value.toLowerCase(),view=document.getElementById('view').value,cat=document.getElementById('category').value;const list=data.records.filter(x=>(view==='all'||(view==='complete')===!!x.collection_completeness?.complete)&&(!cat||x.category===cat)&&JSON.stringify(x).toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(x=>{const c=x.collection_completeness||{percent:0,missing:[]};return`<article class="tool"><div class="head"><h2>${esc(x.name)}</h2><span class="badge ${c.complete?'complete':'research'}">${c.complete?'Tam verili':'Araştırılıyor'}</span></div><p class="muted">${esc(x.category)} · ${esc(x.subcategory)}</p><p class="desc">${esc(x.description)}</p><div class="progress"><i style="width:${c.percent}%"></i></div><p class="muted">Bilgi tamamlama: %${c.percent}</p>${c.missing.length?`<p class="missing">Eksik: ${esc(c.missing.join(', '))}</p>`:''}</article>`}).join('')||`<div class="empty">${view==='complete'?'Henüz tam verili araç yok. İşçi kanıtları ve logoları topladıkça araçlar burada görünecek.':'Kayıt bulunamadı.'}</div>`}
async function startWorker(){const r=await fetch('/api/start',{method:'POST'}),j=await r.json();if(!r.ok)alert(j.error||'Başlatılamadı');await refresh()}
async function stopWorker(){if(!confirm('İşçi durdurulsun ve masaüstü dosyaları hazırlansın mı?'))return;const r=await fetch('/api/stop',{method:'POST'}),j=await r.json();if(!r.ok)alert(j.error||'Durdurulamadı');else alert('Dışa aktarma tamamlandı: '+j.export.directory);await refresh()}
refresh();setInterval(refresh,4000);
</script></body></html>
