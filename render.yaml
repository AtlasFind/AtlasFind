services:
  - type: web
    name: atlasfind
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_production.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ATLASFIND_ENV
        value: production
      - key: ATLASFIND_HTTPS
        value: "1"
      - key: ATLASFIND_TRUST_PROXY
        value: "1"
      - key: ATLASFIND_ALLOWED_HOSTS
        value: atlasfind.org,www.atlasfind.org,.onrender.com
      - key: ATLASFIND_SITE_URL
        value: https://atlasfind.org
      - key: ATLASFIND_CONTACT_EMAIL
        value: atlasfindd@gmail.com
      - key: ATLASFIND_DATABASE_PATH
        value: /opt/render/project/src/storage/atlasfind.db
      - key: ATLASFIND_SECRET_KEY
        generateValue: true
      - key: ATLASFIND_SMTP_HOST
        value: smtp.gmail.com
      - key: ATLASFIND_SMTP_PORT
        value: "465"
      - key: ATLASFIND_SMTP_USER
        value: atlasfindd@gmail.com
      - key: ATLASFIND_SMTP_PASSWORD
        sync: false
      - key: ATLASFIND_SMTP_FROM
        value: AtlasFind <atlasfindd@gmail.com>
      - key: ATLASFIND_SMTP_USE_SSL
        value: "1"
      - key: PYTHON_VERSION
        value: 3.13.5
    disk:
      name: atlasfind-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
